- type: entity
  parent: BaseItem
  id: HandheldNewsVideoCamera
  name: handheld news video camera
  description: A portable, handheld, news video camera.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/bread.rsi
    state: plain
  - type: InteractionOutline
  - type: Eye
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: SurveillanceCameraEntertainment
    transmitFrequencyId: SurveillanceCamera
  - type: SurveillanceCamera
    setupAvailableNetworks:
    - SurveillanceCameraEntertainment
  - type: SurveillanceCameraMicrophone
    blacklist:
      components:
      - SurveillanceCamera
      - SurveillanceCameraMonitor
      - RadioSpeaker
  - type: ActiveListener
    range: 10
  - type: UserInterface
    interfaces:
      enum.SurveillanceCameraSetupUiKey.Camera:
        type: SurveillanceCameraSetupBoundUi
